<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<meta name="theme-color" content="#E30613">
<title>Participação · Sessão Técnica RSB Lisboa</title>
<meta name="description" content="Estado de participação na Sessão Técnica em Substâncias Perigosas.">
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --rsb-red: #E30613;
    --rsb-red-dark: #B0040F;
    --rsb-red-soft: #FCE4E6;
    --texto: #1a1a1a;
    --texto-mute: #5a5a5a;
    --texto-light: #888;
    --linha: #E5E5E5;
    --fundo: #F5F5F7;
    --azul: #1565c0;
    --azul-soft: #E3F0FB;
    --laranja: #C46C00;
    --laranja-soft: #FFF4E5;
    --verde: #1e8a3a;
    --verde-soft: #E8F5EC;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--fundo);
    color: var(--texto);
    font-family: "Montserrat", "Segoe UI", system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body { overflow-x: hidden; }

  /* ===== Cartão principal ===== */
  .wrapper {
    max-width: 540px;
    margin: 0 auto;
    padding: 16px 14px 32px;
  }
  .card {
    background: #fff;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    margin-top: 12px;
  }
  /* Banda topo com logos do convite */
  .banda-topo {
    height: 80px;
    background: var(--rsb-red) url("assets/banda-topo.png") repeat-x center center;
    background-size: auto 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 22px;
  }
  .banda-topo img { height: 56px; width: auto; display: block; position: relative; z-index: 2; }
  /* Banda rodapé */
  .banda-rodape {
    height: 28px;
    background: url("assets/banda-rodape.png") no-repeat center center;
    background-size: 100% 100%;
  }

  /* ===== Cabeçalho informativo ===== */
  .info-evento {
    padding: 18px 22px 8px;
    text-align: center;
    border-bottom: 1px solid var(--linha);
  }
  .info-evento .super {
    font-size: 11px;
    color: var(--texto-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 4px;
    font-weight: 600;
  }
  .info-evento h1 {
    font-size: 17px;
    color: var(--rsb-red);
    font-weight: 800;
    text-transform: uppercase;
    letter-spacing: 0.02em;
    margin: 0 0 6px;
    line-height: 1.2;
  }
  .info-evento .meta {
    font-size: 12.5px;
    color: var(--texto-mute);
    margin: 0;
    line-height: 1.4;
  }

  /* ===== Bloco do participante ===== */
  .participante {
    padding: 24px 22px 18px;
    text-align: center;
  }
  .participante .label {
    font-size: 11px;
    color: var(--texto-light);
    text-transform: uppercase;
    letter-spacing: 0.1em;
    margin: 0 0 6px;
    font-weight: 600;
  }
  .participante .nome {
    font-size: 22px;
    font-weight: 700;
    color: var(--texto);
    margin: 0 0 4px;
    line-height: 1.2;
  }
  .participante .cargo {
    font-size: 13px;
    color: var(--rsb-red);
    font-weight: 600;
    margin: 0 0 2px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }
  .participante .entidade {
    font-size: 13px;
    color: var(--texto-mute);
    margin: 0;
  }
  .participante .num-cert {
    font-size: 11px;
    color: var(--texto-light);
    margin-top: 10px;
    font-family: "SF Mono", Consolas, monospace;
  }

  /* ===== Bloco de estado ===== */
  .estado-bloco {
    padding: 18px 22px 24px;
  }
  .estado-card {
    border-radius: 10px;
    padding: 18px 18px;
    margin-bottom: 14px;
  }
  .estado-card.azul { background: var(--azul-soft); border-left: 4px solid var(--azul); }
  .estado-card.laranja { background: var(--laranja-soft); border-left: 4px solid var(--laranja); }
  .estado-card.verde { background: var(--verde-soft); border-left: 4px solid var(--verde); }
  .estado-card.cinza { background: #f5f5f5; border-left: 4px solid #999; }
  .estado-card.vermelho { background: var(--rsb-red-soft); border-left: 4px solid var(--rsb-red); }

  .estado-card .selo {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 3px 10px;
    border-radius: 999px;
    margin-bottom: 10px;
  }
  .estado-card.azul .selo { background: var(--azul); color: #fff; }
  .estado-card.laranja .selo { background: var(--laranja); color: #fff; }
  .estado-card.verde .selo { background: var(--verde); color: #fff; }
  .estado-card.cinza .selo { background: #555; color: #fff; }
  .estado-card.vermelho .selo { background: var(--rsb-red); color: #fff; }

  .estado-card h2 {
    margin: 0 0 8px;
    font-size: 17px;
    font-weight: 700;
    color: var(--texto);
    line-height: 1.3;
  }
  .estado-card p {
    margin: 0 0 6px;
    font-size: 14px;
    line-height: 1.55;
    color: var(--texto);
  }
  .estado-card p:last-child { margin-bottom: 0; }
  .estado-card .small {
    font-size: 12px;
    color: var(--texto-mute);
    margin-top: 8px;
  }

  /* ===== Botões ===== */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 16px 20px;
    background: var(--rsb-red);
    color: #fff;
    text-decoration: none;
    border-radius: 10px;
    border: none;
    font-family: inherit;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.04em;
    cursor: pointer;
    text-transform: uppercase;
    margin-top: 16px;
    transition: background 0.15s;
  }
  .btn:hover, .btn:active { background: var(--rsb-red-dark); }
  .btn.verde { background: var(--verde); }
  .btn.verde:hover, .btn.verde:active { background: #156d2e; }
  .btn.secundario {
    background: #fff;
    color: var(--texto);
    border: 1px solid var(--linha);
  }
  .btn.secundario:hover { border-color: var(--texto-mute); }
  .btn.pequeno {
    padding: 10px 16px;
    font-size: 12.5px;
    width: auto;
    margin-top: 0;
  }

  /* ===== Toolbar staff ===== */
  .toolbar-staff {
    background: #fff;
    border-bottom: 1px solid var(--linha);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    font-size: 12.5px;
    position: sticky;
    top: 0;
    z-index: 50;
  }
  .toolbar-staff .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 3px 10px;
    border-radius: 999px;
    background: var(--azul-soft);
    color: var(--azul);
    font-weight: 700;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .toolbar-staff .dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--azul);
  }
  .toolbar-staff .filler { flex: 1; }
  .toolbar-staff a, .toolbar-staff button {
    background: transparent;
    border: 1px solid var(--linha);
    color: var(--texto-mute);
    padding: 6px 12px;
    font-size: 11.5px;
    font-family: inherit;
    border-radius: 6px;
    cursor: pointer;
    text-decoration: none;
    font-weight: 600;
  }
  .toolbar-staff a:hover, .toolbar-staff button:hover { color: var(--texto); border-color: var(--texto-mute); }

  /* ===== Acesso staff (botão pequeno) ===== */
  .acesso-staff {
    text-align: center;
    margin-top: 12px;
  }
  .acesso-staff a {
    font-size: 11px;
    color: var(--texto-light);
    text-decoration: none;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    padding: 4px 8px;
  }
  .acesso-staff a:hover { color: var(--texto-mute); }

  /* ===== Modal login staff ===== */
  .modal-fundo {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.5);
    z-index: 100;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 60px 16px 20px;
    overflow-y: auto;
  }
  .modal-fundo.hide { display: none; }
  .modal {
    background: #fff;
    border-radius: 12px;
    max-width: 380px;
    width: 100%;
    padding: 26px 24px;
    box-shadow: 0 12px 32px rgba(0,0,0,0.2);
  }
  .modal h3 {
    margin: 0 0 4px;
    font-size: 18px;
    color: var(--texto);
  }
  .modal .sub {
    margin: 0 0 18px;
    font-size: 12.5px;
    color: var(--texto-mute);
  }
  .modal label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--texto-mute);
    margin: 12px 0 5px;
    font-weight: 600;
  }
  .modal input {
    width: 100%;
    padding: 11px 14px;
    font-size: 15px;
    border: 1px solid var(--linha);
    border-radius: 8px;
    font-family: inherit;
  }
  .modal input:focus { outline: none; border-color: var(--rsb-red); }
  .modal .erro {
    color: var(--rsb-red);
    font-size: 12.5px;
    margin-top: 8px;
    text-align: center;
  }
  .modal .actions {
    display: flex;
    gap: 8px;
    margin-top: 18px;
  }
  .modal .actions .btn { margin-top: 0; }
  .modal .actions .btn.secundario { flex: 1; }
  .modal .actions .btn:not(.secundario) { flex: 2; }

  /* ===== Toast ===== */
  .toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--texto);
    color: #fff;
    padding: 12px 22px;
    border-radius: 24px;
    font-size: 14px;
    font-weight: 500;
    opacity: 0;
    pointer-events: none;
    transition: all 0.25s;
    z-index: 150;
    max-width: 90vw;
    text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%); pointer-events: auto; }
  .toast.ok { background: var(--verde); }
  .toast.err { background: var(--rsb-red); }

  /* ===== Loading ===== */
  .loading {
    text-align: center;
    padding: 40px 20px;
    color: var(--texto-mute);
    font-size: 14px;
  }
  .loading::before {
    content: "";
    display: inline-block;
    width: 24px;
    height: 24px;
    border: 3px solid var(--linha);
    border-top-color: var(--rsb-red);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    vertical-align: middle;
    margin-right: 10px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== Estado erro ===== */
  .erro-bloco {
    background: var(--rsb-red-soft);
    border-left: 4px solid var(--rsb-red);
    padding: 16px 18px;
    border-radius: 10px;
    margin: 14px 0;
  }
  .erro-bloco h3 { margin: 0 0 6px; color: var(--rsb-red); font-size: 16px; }
  .erro-bloco p { margin: 0; font-size: 13px; color: var(--texto); }

  /* ===== Render do certificado embebido (estado 5) ===== */
  .cert-link-wrap {
    text-align: center;
    margin-top: 14px;
  }
  .cert-link-wrap a {
    display: inline-block;
    padding: 14px 28px;
    background: var(--rsb-red);
    color: #fff;
    text-decoration: none;
    border-radius: 8px;
    font-weight: 700;
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
  }
  .cert-img-wrap {
    margin: 12px 0;
    text-align: center;
  }
  .cert-img-wrap img {
    max-width: 100%;
    border: 1px solid var(--linha);
    border-radius: 6px;
  }

  /* ===== Programa do evento ===== */
  .programa-card {
    margin: 0 16px 16px;
    background: #fff;
    border: 1px solid #e6e6e6;
    border-radius: 12px;
    overflow: hidden;
  }
  .programa-status {
    padding: 10px 14px;
    background: #f8f8f8;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--texto-mute);
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .programa-status.live {
    background: var(--rsb-red);
    color: #fff;
  }
  .programa-status.live .ao-vivo {
    width: 8px; height: 8px; border-radius: 50%; background: #fff;
    animation: programa-piscar 1.5s ease-in-out infinite;
    flex-shrink: 0;
  }
  @keyframes programa-piscar { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
  .programa-lista { padding: 4px 0; }
  .programa-item {
    display: flex; align-items: center; gap: 12px;
    padding: 10px 14px;
    border-top: 1px solid #f0f0f0;
    font-size: 13.5px;
    color: var(--texto);
  }
  .programa-item:first-child { border-top: none; }
  .programa-item.activo {
    background: var(--verde-soft);
    border-left: 3px solid var(--verde);
    font-weight: 700;
    display: block;
    padding: 12px 14px;
  }
  .programa-linha {
    display: flex; align-items: center; gap: 12px;
  }
  .programa-hora {
    font-weight: 700; color: var(--rsb-red);
    min-width: 50px;
    font-variant-numeric: tabular-nums;
  }
  .programa-item.activo .programa-hora { color: var(--verde); }
  .programa-titulo { flex: 1; }
  .programa-agora {
    background: var(--verde); color: #fff;
    padding: 2px 8px; border-radius: 4px;
    font-size: 10.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.06em;
    flex-shrink: 0;
  }
  .programa-detalhes {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid #d8ebdc;
    font-weight: 400;
  }
  .programa-painel {
    margin-bottom: 8px;
  }
  .programa-painel-titulo {
    font-size: 12.5px;
    font-weight: 700;
    color: var(--texto);
    line-height: 1.35;
  }
  .programa-painel-orador {
    font-size: 12px;
    color: var(--texto-mute);
    margin-top: 2px;
  }
  .programa-afil { color: var(--texto-mute); }
  .programa-sub-titulo {
    margin-top: 10px; margin-bottom: 4px;
    font-size: 10.5px; font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rsb-red);
  }
  .programa-pessoa {
    display: flex; flex-direction: column; gap: 1px;
    padding: 4px 0;
    font-size: 12px;
  }
  .programa-pessoa-nome { font-weight: 700; color: var(--texto); }
  .programa-pessoa-cargo { color: var(--texto-mute); font-size: 11.5px; }
  .programa-moderacao {
    margin-top: 6px;
    padding-top: 6px;
    border-top: 1px dashed #d8ebdc;
  }
  .programa-apresenta {
    margin-bottom: 10px;
  }
  .programa-papel {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rsb-red);
    margin-bottom: 4px;
  }
  .programa-apresenta .programa-pessoa-nome {
    font-size: 13.5px;
    color: var(--texto);
  }
  .programa-apresenta .programa-pessoa-cargo {
    font-size: 11.5px;
    color: var(--texto-mute);
    margin-top: 1px;
  }
  .programa-descricao {
    margin-top: 6px;
    font-size: 12.5px;
    color: var(--texto-mute);
    font-weight: 400;
    line-height: 1.45;
  }
  .programa-proximo-faixa {
    display: flex;
    flex-direction: column;
    gap: 2px;
    padding: 12px 14px;
    background: #fff4f5;
    border-top: 1px solid #ffd5d9;
    border-bottom: 1px solid #ffd5d9;
  }
  .programa-proximo-faixa.subtil {
    background: #fafafa;
    border-top: 1px solid #ececec;
    border-bottom: 1px solid #ececec;
  }
  .programa-proximo-rotulo {
    font-size: 10.5px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--rsb-red);
  }
  .programa-proximo-faixa.subtil .programa-proximo-rotulo {
    color: var(--texto-mute);
  }
  .programa-proximo-titulo {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--texto);
  }
  .programa-item.proximo .programa-hora {
    color: var(--rsb-red);
  }
  .programa-item.proximo {
    background: #fff8f9;
  }
  .rodape-nota {
    margin: 12px 16px 16px;
    padding: 10px 14px;
    font-size: 12px;
    color: var(--texto-mute);
    text-align: center;
    font-style: italic;
    border-top: 1px solid #ececec;
    padding-top: 12px;
  }

  /* ===== Modo demo (?demo=1 ou ?id=demo) ===== */
  .demo-bar {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    background: #1a1a1a;
    color: #fff;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom)) 12px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 1000;
    box-shadow: 0 -2px 12px rgba(0,0,0,0.3);
  }
  .demo-info { flex: 1; text-align: center; min-width: 0; }
  .demo-rotulo {
    font-size: 9.5px; text-transform: uppercase; letter-spacing: 0.14em;
    color: #ff9d2e; font-weight: 700;
  }
  .demo-estado {
    font-size: 13px; font-weight: 700; margin: 3px 0 5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .demo-dots { display: flex; justify-content: center; gap: 5px; }
  .demo-dot { width: 6px; height: 6px; border-radius: 50%; background: #555; }
  .demo-dot.a { background: #ff9d2e; width: 18px; border-radius: 4px; }
  .demo-btn {
    background: #333; color: #fff; border: none;
    width: 42px; height: 42px; border-radius: 50%;
    font-size: 18px; font-family: inherit; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }
  .demo-btn:active { background: #ff9d2e; }
  body:has(.demo-bar) .wrapper { padding-bottom: 92px; }

  @media (max-width: 480px) {
    .wrapper { padding: 12px 10px 24px; }
    .banda-topo { height: 60px; padding: 0 16px; }
    .banda-topo img { height: 42px; }
    .info-evento { padding: 14px 18px 6px; }
    .info-evento h1 { font-size: 15px; }
    .participante { padding: 18px 18px 12px; }
    .participante .nome { font-size: 19px; }
    .estado-bloco { padding: 14px 18px 20px; }
    .estado-card { padding: 14px 14px; }
    .estado-card h2 { font-size: 15.5px; }
  }
</style>
</head>
<body>

<!-- TOOLBAR STAFF (oculta por defeito, aparece se logado) -->
<div class="toolbar-staff" id="staff-bar" style="display:none">
  <span class="pill"><span class="dot"></span> Modo Staff</span>
  <span class="filler"></span>
  <a href="https://rsblisboa.github.io/Presencas/?tab=livreto">Balcão</a>
  <button id="staff-logout">Sair</button>
</div>

<div class="wrapper">
  <div id="raiz">
    <div class="loading">A consultar estado…</div>
  </div>

  <div class="acesso-staff" id="link-staff">
    <a href="#" id="abrir-staff">Acesso staff</a>
  </div>
</div>

<!-- MODAL LOGIN STAFF -->
<div class="modal-fundo hide" id="modal-staff">
  <div class="modal">
    <h3>Acesso staff</h3>
    <p class="sub">Para marcar presença e validar entregas.</p>
    <label>Utilizador</label>
    <select id="staff-select" style="width:100%;padding:11px 14px;font-size:15px;border:1px solid var(--linha);border-radius:8px;background:#fff;font-family:inherit">
      <option value="">— a carregar —</option>
    </select>
    <label>Palavra-passe</label>
    <input type="password" id="staff-pass" autocomplete="off">
    <div class="erro" id="staff-erro"></div>
    <div id="staff-tablet-status" style="margin-top:12px;padding:8px 10px;border-radius:6px;font-size:11px;text-align:center;background:#f5f5f5;color:var(--texto-mute)"></div>
    <div style="text-align:center;margin-top:10px">

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script src="config.js"></script>
<script>
"use strict";

(function() {
  // ── CONFIG ────────────────────────────────────────────────────────────
  const CFG = window.RSBL_CONFIG || {};
  const GH_OWNER = "RSBLisboa";
  const REPO_PRESENCAS = "Presencas";
  const REPO_CERTIFICADOS = "Certificados";
  const BRANCH = "main";
  const POSTO_ID_STAFF = "p-staff";
  const LS_PAT_KEY = "rsb_pat_tablet";
  function getPAT() { return localStorage.getItem(LS_PAT_KEY) || ""; }
  function setPAT(t) { if (t) localStorage.setItem(LS_PAT_KEY, t); else localStorage.removeItem(LS_PAT_KEY); }
  let USERS_CACHE = [];

  // Pages CDN URLs (leitura pública, sem auth)
  const URL_INSCRITOS = "https://rsblisboa.github.io/Presencas/data/inscritos.json";
  const URL_PRESENCAS = "https://rsblisboa.github.io/Presencas/data/presencas.json";
  const URL_CERTS = "https://rsblisboa.github.io/Presencas/data/certificados.json";
  const URL_EVENTO = "https://rsblisboa.github.io/Presencas/data/evento.json";
  const URL_APRECIACAO = "https://rsblisboa.github.io/Presencas/data/apreciacao.json";

  // ── UTILS ─────────────────────────────────────────────────────────────
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? "" : s)
    .replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

  async function sha256Hex(str) {
    const data = new TextEncoder().encode(str);
    const hash = await crypto.subtle.digest("SHA-256", data);
    return Array.from(new Uint8Array(hash)).map(b => b.toString(16).padStart(2, "0")).join("");
  }
  function utf8ToBase64(s) { return btoa(unescape(encodeURIComponent(s))); }
  function base64ToUtf8(b) { return decodeURIComponent(escape(atob(b))); }
  function nowIso() {
    const d = new Date(), pad = n => String(n).padStart(2, "0");
    return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate())+"T"+pad(d.getHours())+":"+pad(d.getMinutes())+":"+pad(d.getSeconds());
  }
  function fmtData(s) {
    if (!s) return "";
    const m = String(s).match(/^(\d{4})-(\d{2})-(\d{2})/);
    if (!m) return s;
    const meses = ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
    return parseInt(m[3]) + " de " + meses[parseInt(m[2])-1] + " de " + m[1];
  }
  function toast(msg, kind) {
    const el = $("toast");
    el.textContent = msg;
    el.className = "toast show" + (kind ? " " + kind : "");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("show"), 2800);
  }

  function isStaff() {
    return !!getPAT() && !!sessionStorage.getItem("rsb_user");
  }

  // ── FETCH DE ESTADO (público) ─────────────────────────────────────────
  async function fetchJson(url) {
    try {
      const r = await fetch(url + (url.includes("?") ? "&" : "?") + "t=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return null;
      return await r.json();
    } catch (e) { return null; }
  }

  async function existeResposta(idInscricao) {
    // Le data/apreciacao.json (consolidado pelo workflow) e procura por idInscricao.
    const j = await fetchJson(URL_APRECIACAO);
    if (!j || !Array.isArray(j.respostas)) return null;
    return j.respostas.find(r => Number(r.idInscricao) === Number(idInscricao)) || null;
  }

  // ── DECIDIR ESTADO ────────────────────────────────────────────────────
  // ── MODO DEMO ─────────────────────────────────────────────────────────
  // Ativado via ?demo=1 ou ?id=demo. Permite ao staff demonstrar cada estado.
  const DEMO_ESTADOS = [
    { key: "acolhimento",   estado: "aguarda-checkin",      label: "1. Acolhimento dos participantes", hora: "09:35" },
    { key: "abertura",      estado: "aguarda-questionario", label: "2. Abertura da sessao",            hora: "10:05" },
    { key: "paineis",       estado: "aguarda-questionario", label: "3. Paineis Tematicos",             hora: "10:30" },
    { key: "coffee",        estado: "aguarda-questionario", label: "4. Coffee break / questionario",   hora: "11:35" },
    { key: "livreto",       estado: "aguarda-questionario", label: "5. Apresentacao do Livreto",       hora: "11:45" },
    { key: "respondido",    estado: "em-processamento",     label: "6. Resposta confirmada",           hora: "12:00" },
    { key: "encerramento",  estado: "em-processamento",     label: "7. Encerramento",                  hora: "12:35" },
    { key: "em-preparacao", estado: "aguarda-assinatura",   label: "8. Certificado em preparacao",     hora: "13:30" },
    { key: "pronto",        estado: "cert-pronto",          label: "9. Certificado pronto",            hora: "14:30" }
  ];
  const DEMO_INSCRITO = { id: 0, nome: "Maria Silva Carvalho", cargo: "Bombeira de 1.ª Classe", entidade: "RSB Lisboa" };
  const DEMO_EVENTO = { id: 1, titulo: "Sessao Tecnica em Substancias Perigosas", data: "2026-05-18", local: "Auditorio do Metropolitano de Lisboa" };
  const DEMO_CERT = { numero: "2026/0123", link: "https://rsblisboa.github.io/Certificados/?id=DEMO", hash: "abc123def456", dataEmissao: "2026-05-18T18:00:00", anulado: false };

  function isDemoMode() {
    // Em producao so ?demo=1 activa. ?id=demo e ?t=demo so funcionam em dev (localhost/file)
    // para evitar que um link mal copiado ou um valor "demo" inserido por engano abra dados ficticios.
    const p = new URLSearchParams(location.search);
    if (p.get("demo") === "1") return true;
    const isDev = location.hostname === "localhost" || location.hostname === "127.0.0.1" || location.protocol === "file:";
    return isDev && (p.get("id") === "demo" || p.get("t") === "demo");
  }
  function demoEstadoActual() {
    const p = new URLSearchParams(location.search);
    const e = p.get("estado") || DEMO_ESTADOS[0].key;
    return DEMO_ESTADOS.findIndex(s => s.key === e) >= 0 ? e : DEMO_ESTADOS[0].key;
  }
  function demoTimeMinutes() {
    const cur = demoEstadoActual();
    const e = DEMO_ESTADOS.find(s => s.key === cur);
    const h = (e && e.hora) || "10:00";
    const [hh, mm] = h.split(":").map(Number);
    return hh * 60 + mm;
  }
  function demoHoraLabel() {
    const cur = demoEstadoActual();
    const e = DEMO_ESTADOS.find(s => s.key === cur);
    return (e && e.hora) || "—";
  }
  function demoSetEstado(novo) {
    const p = new URLSearchParams(location.search);
    p.set("demo", "1");
    p.set("estado", novo);
    location.search = "?" + p.toString();
  }
  function demoCycle(delta) {
    const cur = demoEstadoActual();
    let idx = DEMO_ESTADOS.findIndex(s => s.key === cur);
    idx = (idx + delta + DEMO_ESTADOS.length) % DEMO_ESTADOS.length;
    demoSetEstado(DEMO_ESTADOS[idx].key);
  }
  function demoBar() {
    const cur = demoEstadoActual();
    const idx = DEMO_ESTADOS.findIndex(s => s.key === cur);
    const lbl = DEMO_ESTADOS[idx] ? DEMO_ESTADOS[idx].label : cur;
    const dots = DEMO_ESTADOS.map((s, i) => `<span class="demo-dot${i === idx ? ' a' : ''}"></span>`).join("");
    return `
      <div class="demo-bar">
        <button class="demo-btn" id="demo-prev" title="Estado anterior">&larr;</button>
        <div class="demo-info">
          <div class="demo-rotulo">Modo demo &middot; hora simulada ${esc(demoHoraLabel())}</div>
          <div class="demo-estado">${esc(lbl)}</div>
          <div class="demo-dots">${dots}</div>
        </div>
        <button class="demo-btn" id="demo-next" title="Estado seguinte">&rarr;</button>
      </div>`;
  }
  function demoEstadoFakeD() {
    const cur = demoEstadoActual();
    const step = DEMO_ESTADOS.find(s => s.key === cur) || DEMO_ESTADOS[0];
    const estado = step.estado;
    return {
      estado,
      inscrito: DEMO_INSCRITO,
      evento: DEMO_EVENTO,
      cert: ["aguarda-assinatura", "cert-pronto"].includes(estado) ? DEMO_CERT : null,
      marcacao: { idInscricao: 0, presente: true, horaEntrada: "2026-05-18T09:42:15", marcadoPor: "tablet-porta" },
      resposta: ["em-processamento", "aguarda-assinatura", "cert-pronto"].includes(estado) ? { idInscricao: 0, submetidoEm: "2026-05-18T11:38:00" } : null
    };
  }

  async function decidirEstado(id) {
    // Etapa 1: resolver token -> inscrito (precisa do inscritos.json antes do resto).
    const ins = await fetchJson(URL_INSCRITOS);
    if (!ins || !Array.isArray(ins.inscritos)) {
      return { estado: "erro", msg: "Não consegui ler a lista de inscritos. Tente recarregar." };
    }
    // Normaliza input: trim, remove caracteres nao-ASCII printaveis (BOM, zero-width, etc.), uppercase.
    // Cobre tokens em minusculas, com espacos colados, ou colados de scanners com lixo unicode.
    const input = String(id || "").trim().replace(/[^\x21-\x7E]/g, "").toUpperCase();
    const looksLikeToken = /^[A-Z0-9]{8}$/.test(input);
    let inscrito = null;
    if (looksLikeToken) {
      inscrito = ins.inscritos.find(i => i.token === input);
    } else if (/^\d+$/.test(input)) {
      inscrito = ins.inscritos.find(i => Number(i.id) === Number(input));
    }
    if (!inscrito) {
      return { estado: "inscrito-desconhecido" };
    }
    const idResolved = inscrito.id;

    // Etapa 2: fetch paralelo dos restantes recursos, agora com idResolved.
    const [pres, certs, evt, resp] = await Promise.all([
      fetchJson(URL_PRESENCAS),
      fetchJson(URL_CERTS),
      fetchJson(URL_EVENTO),
      existeResposta(idResolved)
    ]);

    const evtData = evt || {};

    // Presença?
    const marcacao = pres && Array.isArray(pres.marcacoes)
      ? pres.marcacoes.find(m => Number(m.idInscricao) === Number(idResolved) && m.presente)
      : null;
    if (!marcacao) {
      return { estado: "aguarda-checkin", inscrito, evento: evtData };
    }

    // Resposta ao questionário? (inclui flag local "clicado" para evitar duplicacao)
    // Chave usa idResolved (numerico, sempre presente) para evitar colisoes em kiosk quando
    // o lookup foi por id legado e o inscrito.token podia em principio ficar undefined.
    const flagLocal = (function() {
      try {
        const v = localStorage.getItem("apreciacao_submetida_" + idResolved);
        if (!v) return false;
        return Date.now() - parseInt(v, 10) < 10 * 60 * 1000; // 10 min TTL
      } catch (_) { return false; }
    })();
    if (!resp && !flagLocal) {
      return { estado: "aguarda-questionario", inscrito, evento: evtData, marcacao };
    }
    const respEfectiva = resp || { idInscricao: Number(idResolved), submetidoEm: new Date().toISOString().slice(0, 19), pendingSync: true };

    // Cert emitido?
    const cert = certs && Array.isArray(certs.certificados)
      ? certs.certificados.find(c => Number(c.idInscricao) === Number(idResolved) && !c.anulado)
      : null;
    if (!cert) {
      return { estado: "em-processamento", inscrito, evento: evtData, resposta: respEfectiva };
    }

    // Assinatura digital activa?
    const assinado = evtData.sessaoAssinaturaData || (CFG.SESSAO_ASSINATURA && CFG.SESSAO_ASSINATURA.data);
    if (!assinado) {
      return { estado: "aguarda-assinatura", inscrito, evento: evtData, cert };
    }

    return { estado: "cert-pronto", inscrito, evento: evtData, cert };
  }

  // ── ALTERAÇÕES AO PROGRAMA (lidas de Presencas/data/evento.json) ──────
  // O admin pode publicar alterações em tempo real (orador atrasou-se, slot
  // mudou, pausa extra). Quando programa[] tem entradas, aparece uma faixa
  // de aviso por cima do programa hardcoded.
  let ALTERACOES_PROGRAMA = [];
  let ALTERACOES_TIMESTAMP = "";
  async function carregarAlteracoesPrograma() {
    try {
      const r = await fetch(
        "https://rsblisboa.github.io/Presencas/data/evento.json?t=" + Date.now(),
        { cache: "no-store" }
      );
      if (!r.ok) return;
      const e = await r.json();
      if (Array.isArray(e.programa)) {
        ALTERACOES_PROGRAMA = e.programa;
        ALTERACOES_TIMESTAMP = e.actualizadoEm || "";
      }
    } catch (_) {}
  }
  function alteracoesFaixaHtml() {
    if (!ALTERACOES_PROGRAMA.length) return "";
    const linhas = ALTERACOES_PROGRAMA.map(s => `
      <div style="display:flex;gap:12px;padding:8px 0;border-top:1px solid rgba(255,255,255,0.2);font-size:13px">
        <div style="font-weight:700;min-width:50px">${esc(s.hora || "—")}</div>
        <div style="flex:1">
          <div style="font-weight:600">${esc(s.titulo || "")}</div>
          ${s.orador ? '<div style="opacity:0.85;font-size:12px;margin-top:2px">' + esc(s.orador) + '</div>' : ''}
        </div>
      </div>
    `).join("");
    return `
      <div style="background:linear-gradient(135deg,#c8102e,#a50e26);color:#fff;padding:14px 16px;border-radius:8px;margin-bottom:14px;box-shadow:0 4px 12px rgba(200,16,46,0.25)">
        <div style="font-weight:700;text-transform:uppercase;letter-spacing:0.06em;font-size:11.5px;margin-bottom:8px;display:flex;align-items:center;gap:6px">
          <span>📢</span> Programa actualizado
        </div>
        ${linhas}
        ${ALTERACOES_TIMESTAMP ? '<div style="margin-top:8px;font-size:10.5px;opacity:0.75">' + esc(ALTERACOES_TIMESTAMP) + '</div>' : ''}
      </div>`;
  }

  // ── PROGRAMA DO EVENTO ────────────────────────────────────────────────
  const PROGRAMA_EVENTO = [
    {
      hora: "9h30", inicio: "09:30", titulo: "Acolhimento dos participantes",
      apresenta: { papel: "Recepção", nome: "Secretariado · RSB Lisboa", descricao: "Entrega de crachás e livreto técnico, confirmação de presença no tablet" }
    },
    {
      hora: "10h00", inicio: "10:00", titulo: "Abertura",
      apresenta: { papel: "Sessão de Abertura", nome: "TCor Eng. Alexandre Rodrigues", cargo: "Comandante do Regimento de Sapadores Bombeiros de Lisboa", descricao: "Boas-vindas e enquadramento institucional da sessão técnica" }
    },
    {
      hora: "10h15", inicio: "10:15", titulo: "Painéis Temáticos",
      paineis: [
        { numero: "I", tema: "Formação e sensibilização para Substâncias Perigosas", orador: "Miguel Moita", afiliacao: "Plataforma Intervir.pt" },
        { numero: "II", tema: "Formação para resposta à emergência — First Responders", orador: "José Miguel Ferreira", afiliacao: "ERSBL" }
      ],
      convidados: [
        { nome: "Richard Marques", cargo: "Presidente do Serviço Regional da Proteção Civil · Madeira" },
        { nome: "Luís Martins", cargo: "Inspetor Coordenador do Serviço Regional de Proteção Civil e Bombeiros dos Açores" }
      ],
      moderacao: { nome: "Isabel Galhardo", cargo: "Conselheira de Segurança" }
    },
    {
      hora: "11h30", inicio: "11:30", titulo: "Coffee Break",
      apresenta: { papel: "Pausa", nome: "Foyer do Auditório", descricao: "Pausa para café e networking entre participantes" }
    },
    {
      hora: "11h40", inicio: "11:40", titulo: "Apresentação do Livreto de Substâncias Perigosas",
      apresenta: { papel: "Apresentação técnica", nome: "Equipa Editorial · ERSBL", descricao: "Estrutura, conteúdos e utilização do livreto pelos First Responders" }
    },
    {
      hora: "12h30", inicio: "12:30", titulo: "Encerramento",
      apresenta: { papel: "Sessão de Encerramento", nome: "TCor Eng. Alexandre Rodrigues", cargo: "Comandante do Regimento de Sapadores Bombeiros de Lisboa", descricao: "Síntese, agradecimentos e encerramento oficial da sessão" }
    }
  ];
  const EVENTO_DATA_ISO = "2026-05-18";
  const EVENTO_FIM_MIN = 13 * 60;
  const QUESTIONARIO_ABRE_MIN = 11 * 60 + 30;

  function minutosAgora() {
    // Em modo demo, usa hora simulada associada ao estado actual
    if (typeof isDemoMode === "function" && isDemoMode()) return demoTimeMinutes();
    const d = new Date();
    return d.getHours() * 60 + d.getMinutes();
  }
  function isMesmoDiaEvento() {
    // Em modo demo, finge que estamos no dia do evento
    if (typeof isDemoMode === "function" && isDemoMode()) return true;
    return new Date().toISOString().slice(0, 10) === EVENTO_DATA_ISO;
  }
  function isQuestionarioAberto() {
    if (!isMesmoDiaEvento()) return true;
    return minutosAgora() >= QUESTIONARIO_ABRE_MIN;
  }

  function parseInicio(s) {
    const [h, m] = s.split(":").map(Number);
    return h * 60 + m;
  }
  function programaEstadoAgora() {
    if (!isMesmoDiaEvento()) return { tipo: "fora-de-dia", activoIdx: -1, proximoIdx: -1, minProximo: 0 };
    const minNow = minutosAgora();
    const inicio0 = parseInicio(PROGRAMA_EVENTO[0].inicio);
    if (minNow < inicio0) {
      return { tipo: "antes", activoIdx: -1, proximoIdx: 0, minProximo: inicio0 - minNow };
    }
    if (minNow >= EVENTO_FIM_MIN) {
      return { tipo: "depois", activoIdx: -1, proximoIdx: -1, minProximo: 0 };
    }
    for (let i = 0; i < PROGRAMA_EVENTO.length; i++) {
      const start = parseInicio(PROGRAMA_EVENTO[i].inicio);
      const nextStart = i + 1 < PROGRAMA_EVENTO.length
        ? parseInicio(PROGRAMA_EVENTO[i + 1].inicio)
        : EVENTO_FIM_MIN;
      if (minNow >= start && minNow < nextStart) {
        const proximoIdx = i + 1 < PROGRAMA_EVENTO.length ? i + 1 : -1;
        const minProximo = proximoIdx >= 0 ? parseInicio(PROGRAMA_EVENTO[proximoIdx].inicio) - minNow : 0;
        return { tipo: "live", activoIdx: i, proximoIdx, minProximo };
      }
    }
    return { tipo: "depois", activoIdx: -1, proximoIdx: -1, minProximo: 0 };
  }

  function programaDetalhesHtml(p) {
    let html = "";
    if (p.apresenta) {
      const a = p.apresenta;
      html += `
        <div class="programa-apresenta">
          <div class="programa-papel">${esc(a.papel)}</div>
          <div class="programa-pessoa-nome">${esc(a.nome)}</div>
          ${a.cargo ? '<div class="programa-pessoa-cargo">' + esc(a.cargo) + '</div>' : ''}
          ${a.descricao ? '<div class="programa-descricao">' + esc(a.descricao) + '</div>' : ''}
        </div>`;
    }
    if (Array.isArray(p.paineis) && p.paineis.length) {
      html += p.paineis.map(pa => `
        <div class="programa-painel">
          <div class="programa-painel-titulo">${esc(pa.numero)} · ${esc(pa.tema)}</div>
          <div class="programa-painel-orador">${esc(pa.orador)}${pa.afiliacao ? ' · <span class="programa-afil">' + esc(pa.afiliacao) + '</span>' : ''}</div>
        </div>`).join("");
    }
    if (Array.isArray(p.convidados) && p.convidados.length) {
      html += `<div class="programa-sub-titulo">Oradores convidados</div>`;
      html += p.convidados.map(c => `
        <div class="programa-pessoa">
          <span class="programa-pessoa-nome">${esc(c.nome)}</span>
          ${c.cargo ? '<span class="programa-pessoa-cargo">' + esc(c.cargo) + '</span>' : ''}
        </div>`).join("");
    }
    if (p.moderacao) {
      html += `
        <div class="programa-pessoa programa-moderacao">
          <span class="programa-pessoa-nome">Moderação · ${esc(p.moderacao.nome)}</span>
          ${p.moderacao.cargo ? '<span class="programa-pessoa-cargo">' + esc(p.moderacao.cargo) + '</span>' : ''}
        </div>`;
    }
    return html ? `<div class="programa-detalhes">${html}</div>` : "";
  }

  function programaCard() {
    const st = programaEstadoAgora();
    let header;
    if (st.tipo === "live") {
      header = `<div class="programa-status live"><span class="ao-vivo"></span> Ao vivo · Sessão Técnica</div>`;
    } else if (st.tipo === "antes") {
      header = `<div class="programa-status">Sessão começa às 9h30</div>`;
    } else if (st.tipo === "depois") {
      header = `<div class="programa-status">Sessão concluída</div>`;
    } else {
      header = `<div class="programa-status">Programa · 18 maio 2026</div>`;
    }

    // Faixa "A SEGUIR": aparece quando ha um proximo item e estamos a menos de 15 min
    // (ou se ja passamos para o item — mostra sempre o proximo durante a transicao live)
    let proximoFaixa = "";
    if (st.proximoIdx >= 0 && (st.tipo === "live" || st.tipo === "antes") && st.minProximo > 0 && st.minProximo <= 15) {
      const p = PROGRAMA_EVENTO[st.proximoIdx];
      const tempo = st.minProximo === 1 ? "em 1 min" : `em ${st.minProximo} min`;
      proximoFaixa = `
        <div class="programa-proximo-faixa">
          <span class="programa-proximo-rotulo">A seguir · ${esc(tempo)}</span>
          <span class="programa-proximo-titulo">${esc(p.titulo)}</span>
        </div>`;
    } else if (st.proximoIdx >= 0 && st.tipo === "live") {
      // Sempre mostrar A SEGUIR durante o evento (com a hora)
      const p = PROGRAMA_EVENTO[st.proximoIdx];
      proximoFaixa = `
        <div class="programa-proximo-faixa subtil">
          <span class="programa-proximo-rotulo">A seguir · ${esc(p.hora)}</span>
          <span class="programa-proximo-titulo">${esc(p.titulo)}</span>
        </div>`;
    }

    const items = PROGRAMA_EVENTO.map((p, i) => {
      const isActivo = i === st.activoIdx;
      const isProximo = i === st.proximoIdx && st.proximoIdx >= 0;
      let cls = "programa-item";
      if (isActivo) cls += " activo";
      else if (isProximo) cls += " proximo";
      const badge = isActivo ? '<span class="programa-agora">agora</span>' : "";
      const detalhes = isActivo ? programaDetalhesHtml(p) : "";
      return `
        <div class="${cls}">
          <div class="programa-linha">
            <span class="programa-hora">${esc(p.hora)}</span>
            <span class="programa-titulo">${esc(p.titulo)}</span>
            ${badge}
          </div>
          ${detalhes}
        </div>`;
    }).join("");
    return `${alteracoesFaixaHtml()}<div class="programa-card">${header}${proximoFaixa}<div class="programa-lista">${items}</div></div>`;
  }

  // ── ACÇÃO STAFF: MARCAR PRESENÇA ──────────────────────────────────────
  async function marcarPresenca(idInscricao) {
    if (!isStaff()) { toast("Necessário login staff.", "err"); return; }
    const token = getPAT();
    if (!token) { toast("Tablet sem PAT.", "err"); return; }
    const btn = $("btn-marcar-presenca");
    if (btn) { btn.disabled = true; btn.textContent = "A registar…"; }

    try {
      // 1. Ler presencas.json actual (com sha)
      const u = `https://api.github.com/repos/${GH_OWNER}/${REPO_PRESENCAS}/contents/data/presencas.json?ref=${BRANCH}`;
      const r = await fetch(u, { headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" }});
      let sha = null;
      let payload = { schema: "presencas@1", eventoId: 1, actualizadoEm: nowIso(), versao: 1, marcacoes: [] };
      if (r.ok) {
        const j = await r.json();
        sha = j.sha;
        try { payload = JSON.parse(base64ToUtf8(j.content.replace(/\n/g, ""))); } catch(_) {}
      }
      // 2. Adicionar / actualizar entrada
      const idx = payload.marcacoes.findIndex(m => Number(m.idInscricao) === Number(idInscricao));
      const entry = { idInscricao: Number(idInscricao), presente: true, horaEntrada: nowIso(), marcadoPor: POSTO_ID_STAFF };
      if (idx >= 0) payload.marcacoes[idx] = entry;
      else payload.marcacoes.push(entry);
      payload.actualizadoEm = nowIso();
      payload.versao = (payload.versao || 0) + 1;

      // 3. PUT
      const body = {
        message: `presenca: id ${idInscricao} via QR scan · ${nowIso()}`,
        content: utf8ToBase64(JSON.stringify(payload, null, 2)),
        branch: BRANCH
      };
      if (sha) body.sha = sha;
      const resp = await fetch(`https://api.github.com/repos/${GH_OWNER}/${REPO_PRESENCAS}/contents/data/presencas.json`, {
        method: "PUT",
        headers: { "Authorization": "Bearer " + token, "Accept": "application/vnd.github+json" },
        body: JSON.stringify(body)
      });
      if (!resp.ok) {
        const t = await resp.text();
        throw new Error("HTTP " + resp.status + " · " + t.substring(0, 200));
      }
      toast("Presença marcada.", "ok");
      // Recarregar para mostrar próximo estado
      setTimeout(() => location.reload(), 700);
    } catch (e) {
      console.error(e);
      toast("Falha: " + e.message, "err");
      if (btn) { btn.disabled = false; btn.textContent = "✓ Marcar presença"; }
    }
  }

  // ── LOGIN STAFF (user + pass) ─────────────────────────────────────────
  async function carregarUsers() {
    const evt = await fetchJson(URL_EVENTO);
    if (!evt || !Array.isArray(evt.users)) return [];
    return evt.users.filter(u => u.nome && u.passHash);
  }
  function popularDropdownStaff() {
    const sel = $("staff-select");
    if (!USERS_CACHE.length) {
      sel.innerHTML = '<option value="">— nenhum acesso configurado —</option>';
      return;
    }
    sel.innerHTML = '<option value="">— escolher utilizador —</option>' +
      USERS_CACHE.map(u => `<option value="${esc(u.nome)}">${esc(u.nome)}</option>`).join("");
  }
  function actualizarTabletStatusStaff() {
    const el = $("staff-tablet-status");
    if (!el) return;
    if (getPAT()) {
      el.textContent = "✓ Tablet autorizado";
      el.style.background = "var(--verde-soft)";
      el.style.color = "var(--verde)";
      el.style.fontWeight = "600";
    } else {
      el.textContent = "⚠ Tablet por configurar (admin)";
      el.style.background = "var(--laranja-soft)";
      el.style.color = "var(--laranja)";
      el.style.fontWeight = "600";
    }
  }
  async function loginStaff() {
    const nome = $("staff-select").value;
    const pass = $("staff-pass").value;
    const err = $("staff-erro");
    err.textContent = "";
    if (!getPAT()) { err.textContent = "Tablet não configurado. Pede ao admin para configurar primeiro."; return; }
    if (!nome) { err.textContent = "Escolhe o utilizador."; return; }
    if (!pass) { err.textContent = "Palavra-passe obrigatória."; return; }
    try {
      const u = USERS_CACHE.find(x => x.nome === nome);
      if (!u) { err.textContent = "Utilizador desconhecido."; return; }
      const hash = await sha256Hex(pass);
      if (hash !== u.passHash) { err.textContent = "Palavra-passe incorrecta."; return; }
      // Validar PAT contra GitHub
      const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${REPO_PRESENCAS}`, {
        headers: { "Authorization": "Bearer " + getPAT(), "Accept": "application/vnd.github+json" }
      });
      if (r.status === 401 || r.status === 403) { err.textContent = "PAT do tablet sem permissões."; return; }
      if (!r.ok) { err.textContent = "GitHub HTTP " + r.status; return; }
      sessionStorage.setItem("rsb_user", nome);
      $("modal-staff").classList.add("hide");
      toast("Login OK · " + nome, "ok");
      setTimeout(() => location.reload(), 400);
    } catch (e) {
      err.textContent = e.message;
    }
  }
  function logoutStaff() {
    sessionStorage.removeItem("rsb_user");
    location.reload();
  }
  async function tabletSave() {
    const tok = $("tablet-token").value.trim();
    const err = $("tablet-erro");
    err.textContent = "";
    if (!tok) { err.textContent = "Cola o token PAT."; return; }
    try {
      const r = await fetch(`https://api.github.com/repos/${GH_OWNER}/${REPO_PRESENCAS}`, {
        headers: { "Authorization": "Bearer " + tok, "Accept": "application/vnd.github+json" }
      });
      if (r.status === 401 || r.status === 403) { err.textContent = "PAT sem permissões."; return; }
      if (!r.ok) { err.textContent = "GitHub HTTP " + r.status; return; }
      setPAT(tok);
      $("modal-tablet").classList.add("hide");
      actualizarTabletStatusStaff();
      toast("Tablet autorizado", "ok");
    } catch (e) {
      err.textContent = "Falha: " + e.message;
    }
  }
  function tabletClear() {
    setPAT("");
    $("modal-tablet").classList.add("hide");
    actualizarTabletStatusStaff();
    toast("Token removido", "ok");
  }

  // ── INIT ──────────────────────────────────────────────────────────────
  (async function init() {
    // Buscar alterações de última hora ao programa (não bloqueia).
    carregarAlteracoesPrograma().catch(() => {});

    // Toolbar staff
    if (isStaff()) {
      $("staff-bar").style.display = "flex";
      $("link-staff").style.display = "none";
    }

    // Modal login handlers
    $("abrir-staff").addEventListener("click", async e => {
      e.preventDefault();
      $("staff-pass").value = "";
      $("staff-erro").textContent = "";
      USERS_CACHE = await carregarUsers();
      popularDropdownStaff();
      actualizarTabletStatusStaff();
      $("modal-staff").classList.remove("hide");
      $("staff-select").focus();
    });
    $("staff-cancel").addEventListener("click", () => $("modal-staff").classList.add("hide"));
    $("staff-entrar").addEventListener("click", loginStaff);
    $("staff-pass").addEventListener("keypress", e => { if (e.key === "Enter") loginStaff(); });
    $("staff-logout").addEventListener("click", logoutStaff);
    $("modal-staff").addEventListener("click", e => { if (e.target.id === "modal-staff") $("modal-staff").classList.add("hide"); });

    // Configurar tablet (PAT)
    $("staff-config-tablet").addEventListener("click", e => {
      e.preventDefault();
      $("tablet-token").value = "";
      $("tablet-erro").textContent = "";
      $("modal-tablet").classList.remove("hide");
      $("tablet-token").focus();
    });
    $("tablet-save").addEventListener("click", tabletSave);
    $("tablet-clear").addEventListener("click", tabletClear);
    $("tablet-cancel").addEventListener("click", e => { e.preventDefault(); $("modal-tablet").classList.add("hide"); });
    $("tablet-token").addEventListener("keypress", e => { if (e.key === "Enter") tabletSave(); });
    $("modal-tablet").addEventListener("click", e => { if (e.target.id === "modal-tablet") $("modal-tablet").classList.add("hide"); });

    // Param: ?t=<token> e o caminho canonico. ?id=<numero> mantem-se para retrocompat.
    // A funcao decidirEstado resolve o token para o id interno do participante.
    const params = new URLSearchParams(location.search);
    const tokenOrId = params.get("t") || params.get("token") || params.get("id");
    const id = tokenOrId; // nome legado mantido para evitar refactor profundo abaixo

    // ── MODO DEMO ─────────────────────────────────────
    if (isDemoMode()) {
      const renderDemo = function() {
        const d = demoEstadoFakeD();
        let html = "";
        switch (d.estado) {
          case "aguarda-checkin":       html = renderAguardaCheckin(d); break;
          case "aguarda-questionario":  html = renderAguardaQuestionario(d); break;
          case "em-processamento":      html = renderEmProcessamento(d); break;
          case "aguarda-assinatura":    html = renderAguardaAssinatura(d); break;
          case "cert-pronto":           html = renderCertPronto(d); break;
          default:                      html = renderErro("Estado demo desconhecido: " + d.estado);
        }
        $("raiz").innerHTML = html + demoBar();
        const prev = $("demo-prev"); if (prev) prev.addEventListener("click", () => demoCycle(-1));
        const next = $("demo-next"); if (next) next.addEventListener("click", () => demoCycle(1));
      };
      renderDemo();
      return;
    }

    if (!id) {
      $("raiz").innerHTML = renderSemId();
      return;
    }

    async function rerender() {
      try {
        const d = await decidirEstado(id);
        let html = "";
        switch (d.estado) {
          case "inscrito-desconhecido": html = renderInscritoDesconhecido(); break;
          case "aguarda-checkin":       html = renderAguardaCheckin(d); break;
          case "aguarda-questionario":  html = renderAguardaQuestionario(d); break;
          case "em-processamento":      html = renderEmProcessamento(d); break;
          case "aguarda-assinatura":    html = renderAguardaAssinatura(d); break;
          case "cert-pronto":           html = renderCertPronto(d); break;
          case "erro":                  html = renderErro(d.msg); break;
          default:                      html = renderErro("Estado desconhecido: " + d.estado);
        }
        $("raiz").innerHTML = html;
        const btn = $("btn-marcar-presenca");
        if (btn) btn.addEventListener("click", () => marcarPresenca(btn.dataset.id));
        // Bind do click no link "Responder ao questionario" para marcar localmente
        // que o utilizador clicou — UI passa a "Resposta confirmada" mesmo antes da
        // confirmacao do backend, evitando duplicacao de respostas.
        document.querySelectorAll("[data-marcar-submetida]").forEach(el => {
          el.addEventListener("click", () => {
            const idx = el.dataset.marcarSubmetida;
            try { localStorage.setItem("apreciacao_submetida_" + idx, String(Date.now())); } catch (_) {}
            setTimeout(rerender, 2500);
          });
        });
      } catch (e) {
        console.error(e);
        $("raiz").innerHTML = renderErro(e.message);
      }
    }

    await rerender();
    // Auto-refresh a cada 60s: actualiza programa "agora", destranca questionario as 11h30,
    // e captura mudancas de estado (presenca marcada, cert emitido, etc.)
    setInterval(rerender, 60000);
  })();
})();
