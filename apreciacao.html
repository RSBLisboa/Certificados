<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A redireccionar… · RSB Lisboa</title>
<meta name="robots" content="noindex, nofollow">
<style>
  body { font-family: "Segoe UI", system-ui, sans-serif; padding: 40px 16px; text-align: center; color: #555; }
  .spinner { width: 32px; height: 32px; border: 3px solid #ddd; border-top-color: #E30613; border-radius: 50%; animation: s 0.8s linear infinite; margin: 20px auto; }
  @keyframes s { to { transform: rotate(360deg); } }
  a { color: #E30613; font-weight: 600; }
</style>
</head>
<body>
<div class="spinner"></div>
<p>A redireccionar para o seu estado de participação…</p>
<p style="font-size:12px;margin-top:20px">Se não for redireccionado em 2 segundos, <a id="manual" href="p.html">toque aqui</a>.</p>
<script>
(function() {
  // O endereço apreciacao.html foi substituído pela landing page única p.html.
  // Mantemos este redirect para compatibilidade com QRs antigos.
  var u = new URLSearchParams(location.search);
  var id = u.get("id") || "";
  var alvo = "p.html" + (id ? "?id=" + encodeURIComponent(id) : "");
  document.getElementById("manual").href = alvo;
  setTimeout(function() { location.replace(alvo); }, 600);
})();
</script>
</body>
</html>
